name: Nightly (T4)

# Tier T4 (AGENTS.md, "The gate"): nightly and on demand. Debug + AddressSanitizer, line
# coverage, whole-tree cppcheck and dead code, clang-tidy naming, the mutation-catalog ratchet,
# and the T4 CTest labels. None of it runs on push; T2 (ci.yml) is the per-push gate.

on:
  schedule:
    # 08:23 UTC: the small hours across the US, off the top of the hour when scheduled runs
    # queue up.
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  T4_LABELS: '^(tooling-extended|mutation|coverage|tidy|cert-tooling|fuzz-extended)$'
  # See ci.yml: a hosted runner has no drive anyone cares about.
  SAK_TEST_ALLOW_REAL_HARDWARE: '1'
  # clang-tidy comes from Program Files\LLVM (scripts/run_clang_tidy.ps1). The image ships an
  # older LLVM; install the version developers run so the naming gate parses the same way.
  # Same release as clang-format in requirements-gates.txt, so both tools parse alike.
  LLVM_VERSION: '23.1.3'
  LLVM_SHA256: '5153f848ac87553118340f16f8d3cd4351d729bcba6e4785c6a4a9af29676de9'

jobs:
  # ==========================================================================================
  # The T4 CTest labels. Builds only the base set and the executables those tests run.
  # ==========================================================================================
  t4-tests:
    name: T4 CTest labels
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Toolchain
      uses: ./.github/actions/windows-build-env
      with:
        cppcheck: 'true'

    - name: Configure
      shell: pwsh
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
          -DVCPKG_APPLOCAL_DEPS=OFF `
          -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DSAK_PYTHON_EXECUTABLE="$env:pythonLocation\python.exe"
        $configureExit = $LASTEXITCODE
        "CONFIGURE EXIT: $configureExit"
        exit $configureExit

    - name: Plan
      shell: pwsh
      run: |
        & scripts/plan_ci_build_shards.ps1 -BuildDir build -ShardCount 1 -ShardIndex 0 `
          -SelectedTestsOnly -LabelRegex $env:T4_LABELS -OutFile build/ci-plan.json

    - name: Build
      id: build
      shell: pwsh
      run: |
        $plan = Get-Content -Raw build/ci-plan.json | ConvertFrom-Json
        # The program and its helper too: the Defender step below scans the built Release folder.
        $targets = @(@($plan.build_targets) + 'sak_utility' + 'sak_elevated_helper' | Select-Object -Unique) -join ';'
        msbuild build/SAK_Utility.sln /m /nologo /verbosity:minimal /p:Configuration=Release /p:Platform=x64 "/t:$targets"
        $buildExit = $LASTEXITCODE
        "BUILD EXIT: $buildExit"
        exit $buildExit

    # The suites run as a standard user; a hosted runner is an elevated administrator. See the
    # matching step in ci.yml and scripts/invoke_unelevated.ps1.
    - name: Grant the standard-user token access to the workspace
      shell: pwsh
      run: |
        $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
        icacls $env:GITHUB_WORKSPACE /grant "*${sid}:(OI)(CI)F" /T /C /Q
        exit $LASTEXITCODE
    - name: Test (T4 labels)
      shell: pwsh
      run: |
        & scripts/invoke_unelevated.ps1 -FilePath ctest -- --test-dir build -C Release `
          -j $env:NUMBER_OF_PROCESSORS --output-on-failure --no-tests=error -L $env:T4_LABELS `
          -E '^test_defender_clean$'
        $ctestExit = $LASTEXITCODE
        "CTEST EXIT: $ctestExit"
        exit $ctestExit

    # test_defender_clean (tooling-extended) runs here instead of in the ctest step above: it scans
    # the repository's tests and scripts trees and the built Release folder (minutes, so not in T2),
    # and a hosted runner may have no Defender running. Then the scan proves nothing, and this step
    # says so as a warning in the run's summary instead of passing quietly.
    - name: Defender scan (tests, scripts, build/Release)
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: pwsh
      run: |
        $why = ''
        try {
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (-not ($status.AMServiceEnabled -and $status.AntivirusEnabled)) {
            $why = "service enabled: $($status.AMServiceEnabled), antivirus enabled: $($status.AntivirusEnabled)"
          }
        } catch {
          $why = "Get-MpComputerStatus failed: $($_.Exception.Message)"
        }
        if (-not $why) {
          & pwsh -NoProfile -NonInteractive -File scripts/test_defender_clean.ps1 tests scripts build/Release
          exit $LASTEXITCODE
        }
        $note = "Microsoft Defender is not running on this runner ($why), so test_defender_clean scanned nothing tonight."
        Write-Host "::warning title=Defender scan not run::$note"
        Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Defender scan`n`n**Not run.** $note`n"
        & pwsh -NoProfile -NonInteractive -File scripts/test_defender_clean.ps1 tests scripts build/Release -AllowMissingDefender
        exit $LASTEXITCODE

    - name: Upload test logs
      if: ${{ failure() && steps.build.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: t4-test-logs
        path: |
          build/test_results/*.txt
          build/Testing/Temporary/LastTest.log
        retention-days: 14
        if-no-files-found: warn

  # ==========================================================================================
  # Whole-tree static analysis. Each gate is its own step and runs even after another fails.
  # ==========================================================================================
  t4-static:
    name: T4 static analysis
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Toolchain
      uses: ./.github/actions/windows-build-env
      with:
        cppcheck: 'true'

    # Cached under its pinned SHA-256; the toolchain action's pinned_download.ps1 retries an outage
    # and uses a cached copy only when it is the pinned file.
    - name: Cache LLVM download
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ runner.temp }}/pinned-downloads/llvm
        key: pinned-llvm-${{ env.LLVM_SHA256 }}

    - name: Install LLVM
      shell: pwsh
      run: |
        # LLVM publishes its Windows release as an .msi from 23.x (no NSIS .exe).
        $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi"
        $msi = & ./.github/actions/windows-build-env/pinned_download.ps1 -Url $url -Sha256 $env:LLVM_SHA256 `
          -Directory (Join-Path $env:RUNNER_TEMP 'pinned-downloads/llvm') -Name "LLVM-$env:LLVM_VERSION-win64.msi"
        # The image's LLVM is a Chocolatey package; remove it so the installer owns the folder.
        choco uninstall llvm -y --no-progress
        $p = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw "LLVM install exited $($p.ExitCode)" }
        $version = (& "$env:ProgramFiles\LLVM\bin\clang-tidy.exe" --version) -join ' '
        Write-Host $version
        if ($version -notmatch "version $([regex]::Escape($env:LLVM_VERSION))(\s|$)") { throw "clang-tidy is not $env:LLVM_VERSION" }

    # The clang-tidy gate rebuilds Ninja compile databases from the configured build cache.
    - name: Configure
      shell: pwsh
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
          -DVCPKG_APPLOCAL_DEPS=OFF `
          -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DSAK_PYTHON_EXECUTABLE="$env:pythonLocation\python.exe"
        $configureExit = $LASTEXITCODE
        "CONFIGURE EXIT: $configureExit"
        exit $configureExit

    - name: Gate tool versions
      id: setup
      shell: pwsh
      run: '& scripts/check_tool_preflight.ps1 -IncludeOptional'

    # Whole project, both passes; asserts cppcheck's own active-checker count so a silently
    # degraded analyzer cannot pass.
    - name: cppcheck whole-project gate
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/cppcheck_whole_project_gate.ps1'

    - name: Dead first-party source function gate
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_dead_code.ps1'

    - name: clang-tidy naming health + ratchet
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/clang_tidy_naming_gate.ps1'

    # Every catalog find-string still occurs exactly once in current source and the catalog set
    # matches MANIFEST.txt. Static; the slow build+mutate pass stays local.
    - name: Mutation-catalog integrity
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: python scripts/run_all_mutation_catalogs.py --validate

  # ==========================================================================================
  # Debug configuration + AddressSanitizer over the native suites.
  #
  # Only Release was ever built or tested, and three failures hid behind that: ENABLE_ASAN=ON
  # applied no flag under the multi-config generator (0 of 246 projects instrumented), nine
  # test executables could not run in Debug at all (Q_ASSERT guards, and one real persistent-
  # model-index corruption Release cannot detect), and Debug was assumed broken so nobody saw
  # either. A configuration that is never built rots. The script-test labels are left out
  # here: they exercise the Release tree (build/Release) by design.
  # ==========================================================================================
  asan:
    name: Debug build + AddressSanitizer
    runs-on: windows-2022
    timeout-minutes: 330

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Toolchain
      uses: ./.github/actions/windows-build-env

    - name: Configure (Debug, ASan)
      shell: pwsh
      run: |
        cmake -S . -B build-debug -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
          -DVCPKG_APPLOCAL_DEPS=OFF `
          -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
          -DENABLE_ASAN=ON `
          -DSAK_TEST_TIMEOUT_SCALE=5 `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DSAK_PYTHON_EXECUTABLE="$env:pythonLocation\python.exe"
        $configureExit = $LASTEXITCODE
        "CONFIGURE EXIT: $configureExit"
        exit $configureExit

    - name: Build (Debug)
      shell: pwsh
      run: |
        cmake --build build-debug --config Debug --parallel
        $buildExit = $LASTEXITCODE
        "BUILD EXIT: $buildExit"
        exit $buildExit

    # The suites run as a standard user; a hosted runner is an elevated administrator. See the
    # matching step in ci.yml and scripts/invoke_unelevated.ps1.
    - name: Grant the standard-user token access to the workspace
      shell: pwsh
      run: |
        $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
        icacls $env:GITHUB_WORKSPACE /grant "*${sid}:(OI)(CI)F" /T /C /Q
        exit $LASTEXITCODE

    # The first run (42913851120, 2026-11-10) lost a suite to 0xc0000409 with no message and two
    # more with no detail: ctest's console shows the program's log, while QTest writes its verdicts
    # to test_results/*.txt, and nothing kept either. Windows Error Reporting now writes a dump for
    # any test process that ends abnormally (a fail-fast included), the next step prints a stack for
    # each, and the result files and dumps are kept.
    - name: Keep crash dumps of the test executables
      shell: pwsh
      run: |
        $dumps = Join-Path $env:RUNNER_TEMP 'crash-dumps'
        New-Item -ItemType Directory -Force -Path $dumps | Out-Null
        icacls $dumps /grant '*S-1-1-0:(OI)(CI)F' /C /Q | Out-Null
        $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
        New-Item -Path $key -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpFolder -Value $dumps -PropertyType ExpandString -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpCount -Value 30 -PropertyType DWord -Force | Out-Null

    - name: Test (Debug, ASan, native suites)
      shell: pwsh
      run: |
        & scripts/invoke_unelevated.ps1 -FilePath ctest -- --test-dir build-debug -C Debug `
          -j $env:NUMBER_OF_PROCESSORS --output-on-failure --no-tests=error -L '^(product|fuzz-extended)$'
        $ctestExit = $LASTEXITCODE
        "CTEST EXIT: $ctestExit"
        exit $ctestExit

    - name: Stacks from any crash dumps
      if: ${{ always() }}
      shell: pwsh
      run: |
        $dumps = Join-Path $env:RUNNER_TEMP 'crash-dumps'
        $files = @(Get-ChildItem -LiteralPath $dumps -Filter *.dmp -ErrorAction SilentlyContinue)
        "crash dumps: $($files.Count)"
        $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
        if ($files.Count -gt 0 -and -not (Test-Path -LiteralPath $cdb)) { 'cdb is not on this runner; the dumps are in the artifact' }
        $symbols = "srv*$env:RUNNER_TEMP\symbols*https://msdl.microsoft.com/download/symbols;" +
          "$env:GITHUB_WORKSPACE\build-debug\tests\Debug;$env:GITHUB_WORKSPACE\build-debug\Debug"
        foreach ($file in $files) {
          "===== $($file.Name)"
          if (Test-Path -LiteralPath $cdb) {
            & $cdb -z $file.FullName -y $symbols -c '.ecxr; kb 80; !analyze -v; q' 2>&1 | Select-Object -Last 250
          }
        }
        exit 0

    - name: Keep the QTest results and crash dumps
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: asan-test-results
        path: |
          ${{ runner.temp }}/crash-dumps/
          build-debug/test_results/*.txt
        if-no-files-found: warn
        retention-days: 14

  # ==========================================================================================
  # Line coverage (OpenCppCoverage) over the curated core set. RelWithDebInfo, because the
  # Release build strips the PDBs coverage maps against. See docs/COVERAGE_BASELINE.md.
  # ==========================================================================================
  coverage:
    name: Line coverage (core subsystems)
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Toolchain
      uses: ./.github/actions/windows-build-env

    - name: Install OpenCppCoverage
      shell: pwsh
      run: |
        choco install opencppcoverage --version 0.9.9 -y --no-progress
        if ($LASTEXITCODE -ne 0) { throw "choco install opencppcoverage exited $LASTEXITCODE" }

    - name: Configure
      shell: pwsh
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
          -DVCPKG_APPLOCAL_DEPS=OFF `
          -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DSAK_PYTHON_EXECUTABLE="$env:pythonLocation\python.exe"
        $configureExit = $LASTEXITCODE
        "CONFIGURE EXIT: $configureExit"
        exit $configureExit

    - name: Build core tests (RelWithDebInfo)
      shell: pwsh
      run: |
        cmake --build build --config RelWithDebInfo --parallel --target `
          test_pst_parser test_fuzz_pst_parser test_mbox_parser test_fuzz_mbox_headers `
          test_fuzz_mbox_transfer_decoder test_iso_analyzer test_fuzz_iso_analyzer `
          test_ai_tool_policy test_fuzz_command_classifier test_fuzz_email_sanitizer `
          test_fuzz_mcp_framing test_crash_reporter test_encryption test_input_validator `
          test_path_utils test_email_types
        $buildExit = $LASTEXITCODE
        "BUILD EXIT: $buildExit"
        exit $buildExit

    - name: Measure coverage
      shell: pwsh
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        & scripts/run_coverage.ps1 `
          -TestRegex '^test_(pst_parser|fuzz_pst_parser|mbox_parser|fuzz_mbox_headers|fuzz_mbox_transfer_decoder|iso_analyzer|fuzz_iso_analyzer|ai_tool_policy|fuzz_command_classifier|fuzz_email_sanitizer|fuzz_mcp_framing|crash_reporter|encryption|input_validator|path_utils|email_types)$' `
          -OutDir build/coverage `
          -QtBin "$env:QT_ROOT_DIR/bin"

    - name: Upload coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: coverage-html
        path: build/coverage/html
        retention-days: 30
