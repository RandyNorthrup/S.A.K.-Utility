name: Secret Scan and Credential Leak Gate

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # gitleaks_8.30.1_linux_x64.tar.gz, pinned here rather than read from the same release's
      # checksums file, which whoever could replace the archive could replace too.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          # curl's --retry tries again only on a timeout or an HTTP 408, 429 or 5xx answer (GitHub's
          # release downloads answered 504 for a while on 2026-11-08); a 404 still fails at once.
          curl -sSfL --retry 3 --retry-delay 30 -o "${archive}" "${base_url}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        shell: bash
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  trufflehog:
    name: TruffleHog verified secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2  # v3.99.7
        with:
          path: ./
          extra_args: --only-verified
          # The action runs ghcr.io/trufflesecurity/trufflehog:<version>, "latest" unless set. The
          # 3.99.7 image, pinned by its digest as well (docker runs name:tag@digest by the digest).
          version: 3.99.7@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1
