name: CI (T2)

# Tier T2 (AGENTS.md, "The gate"): every push to dev or main and every pull request to them.
# Build every target, run the T2 CTest labels in parallel, the whole-tree static gates, and the
# post-build gates against the built Release app. T3 (package, sign, release) is release.yml;
# T4 (ASan, coverage, whole-tree cppcheck, dead code, clang-tidy, T4 labels) is nightly.yml.

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

# A superseded run of the same branch or pull request stops instead of finishing work its
# successor has already made irrelevant. A run on main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Anchored on purpose. An unanchored "product|release-tooling|tooling|cert" also matches
  # tooling-extended and cert-tooling, which pulls 23 T4 tests into T2.
  T2_LABELS: '^(product|release-tooling|tooling|cert)$'
  # A hosted runner has no drive anyone cares about, so the tests that reach real drives and the
  # real application run here. Unset on a person's PC, where tests/support/test_hardware_guard.h
  # ends a test binary before it can get there.
  SAK_TEST_ALLOW_REAL_HARDWARE: '1'

jobs:
  # ==========================================================================================
  # Whole-tree static gates. No build needed. Each gate is its own step, so a red gate cannot
  # be hidden by a later green one, and every gate still runs after an earlier one fails.
  # ==========================================================================================
  static-gates:
    name: T2 static gates (whole tree)
    # Pinned to windows-2022 (Visual Studio 2022 / v17), matching the build jobs.
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Toolchain
      uses: ./.github/actions/windows-build-env
      with:
        build-tools: 'false'

    - name: Cache pre-commit environments
      id: setup
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~\.cache\pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'requirements-gates.txt') }}

    - name: Repository hygiene (whole tree)
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_repository_hygiene.ps1'

    - name: Test registration
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_test_registration.ps1'

    - name: Qt resource manifests
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_qrc_resources.ps1'

    - name: PowerShell syntax and variable casing (whole tree)
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_powershell_syntax.ps1'

    # An explicit whole-tree list plus -RequireFiles: with no arguments the script legitimately
    # exits 0 ("No C++ files to format", its pre-commit contract), so a bare call would be a
    # green gate that checked nothing. The exclusion is unanchored to match the hook's exclude.
    - name: Formatting (clang-format, whole first-party tree)
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: |
        $files = git ls-files '*.c' '*.cpp' '*.h' '*.hpp' '*.cxx' '*.cc' '*.hxx' |
          Where-Object { $_ -notmatch '(third_party|3rdparty|external|_archived)/' }
        Write-Host "clang-format over $(@($files).Count) first-party sources"
        & scripts/run_clang_format.ps1 -Check -RequireFiles -Files $files

    - name: Complexity (lizard, C++ and JavaScript)
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: python scripts/run_lizard.py

    # With no arguments the script scans every tracked file (git ls-files).
    - name: ASCII-only text (whole tree)
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_ascii_only.ps1'

    - name: Secret and developer-path scan (regex, current tree)
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/scan_secrets.ps1 -SkipExternalTools'

    - name: Third-party licenses
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_third_party_licenses.ps1'

    - name: Blocking patterns
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_blocking_patterns.ps1'

    - name: GUI style tokens
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_gui_style_tokens.ps1'

    - name: GUI magic numbers
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_gui_magic_numbers.ps1'

    - name: GUI stylesheet literals
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_gui_stylesheet_literals.ps1'

    - name: Magic numbers
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: python scripts/check_magic_numbers.py

    - name: Dialog buttons return before their dialog opens
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: python scripts/check_dialog_buttons_deferred.py

    - name: Logged message boxes
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_logged_message_boxes.ps1'

    - name: Error-message uniqueness
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_error_message_uniqueness.ps1'

    - name: Build-system lint
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      shell: pwsh
      run: '& scripts/check_build_system_lint.ps1'

  # ==========================================================================================
  # Build every target and run the T2 labels, spread over several runners.
  #
  # One hosted runner needs well over an hour for the whole tree (each test executable compiles
  # its own copy of the first-party sources and links with LTCG). Each shard configures the same
  # tree and runs scripts/plan_ci_build_shards.ps1, which gives every shard the base set
  # (sak_utility and what it stages into build/Release) plus a share of the other targets, and
  # each T2 test to the shard that builds the executables it runs. The plan refuses to leave a
  # default-build target unbuilt or a T2 test unassigned; the T2 result job checks that every
  # shard computed the same plan and that every T2 test was registered on some shard.
  # ==========================================================================================
  build-test:
    name: T2 build + test (shard ${{ matrix.shard }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Toolchain
      uses: ./.github/actions/windows-build-env
      with:
        cppcheck: 'true'

    - name: Configure
      shell: pwsh
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
          -DVCPKG_APPLOCAL_DEPS=OFF `
          -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DSAK_PYTHON_EXECUTABLE="$env:pythonLocation\python.exe"
        $configureExit = $LASTEXITCODE
        "CONFIGURE EXIT: $configureExit"
        exit $configureExit

    - name: Plan this shard
      id: plan
      shell: pwsh
      env:
        SHARD_COUNT: ${{ strategy.job-total }}
        SHARD_INDEX: ${{ strategy.job-index }}
      run: |
        & scripts/plan_ci_build_shards.ps1 -BuildDir build `
          -ShardCount $env:SHARD_COUNT -ShardIndex $env:SHARD_INDEX `
          -LabelRegex $env:T2_LABELS -OutFile build/ci-plan.json
        $plan = Get-Content -Raw build/ci-plan.json | ConvertFrom-Json
        Write-Host "Targets: $($plan.build_targets -join ' ')"
        Write-Host "Tests:   $($plan.tests -join ' ')"

    - name: Build
      id: build
      shell: pwsh
      run: |
        $plan = Get-Content -Raw build/ci-plan.json | ConvertFrom-Json
        $targets = @($plan.build_targets) -join ';'
        msbuild build/SAK_Utility.sln /m /nologo /verbosity:minimal /p:Configuration=Release /p:Platform=x64 "/t:$targets"
        $buildExit = $LASTEXITCODE
        "BUILD EXIT: $buildExit"
        exit $buildExit

    # The app and its suite run as a standard user on stock Windows; a hosted runner is an
    # elevated administrator with Developer Mode switched on (runner-images
    # Configure-DeveloperMode.ps1). Everything that runs the built binaries goes through
    # scripts/invoke_unelevated.ps1, which gives it a standard-user token and refuses to run if
    # that token is still an enabled Administrators member; that token needs explicit write access
    # to the tree the elevated steps created. Developer Mode goes back to the stock default (off),
    # because it lets a standard user create symlinks, which changes what the suite can run
    # (tests/skip_baseline.txt records the stock behavior).
    - name: Match a stock standard-user environment
      id: grant
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: pwsh
      run: |
        whoami /user
        Set-ItemProperty -Path HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock `
          -Name AllowDevelopmentWithoutDevLicense -Value 0 -Type DWord
        $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
        $sw = [Diagnostics.Stopwatch]::StartNew()
        icacls $env:GITHUB_WORKSPACE /grant "*${sid}:(OI)(CI)F" /T /C /Q
        $grantExit = $LASTEXITCODE
        "icacls exit $grantExit after $([int]$sw.Elapsed.TotalSeconds) s"
        exit $grantExit

    # Post-build gates against the built app: once, on shard 0, before the parallel tests load
    # the machine (the startup budget is a wall-clock limit).
    - name: Windows runtime dependencies
      if: ${{ !cancelled() && steps.grant.outcome == 'success' && matrix.shard == 0 }}
      shell: pwsh
      run: '& scripts/verify_windows_runtime_dependencies.ps1 -RootDir build/Release -PrimaryExe sak_utility.exe'

    - name: Startup performance budget
      if: ${{ !cancelled() && steps.grant.outcome == 'success' && matrix.shard == 0 }}
      shell: pwsh
      run: '& scripts/invoke_unelevated.ps1 -FilePath pwsh -- -NoProfile -NonInteractive -File scripts/check_startup_budget.ps1'

    - name: Accessibility runtime audit
      if: ${{ !cancelled() && steps.grant.outcome == 'success' && matrix.shard == 0 }}
      shell: pwsh
      run: '& scripts/invoke_unelevated.ps1 -FilePath pwsh -- -NoProfile -NonInteractive -File scripts/check_accessibility_patterns.ps1'

    - name: Test (T2 labels, this shard)
      if: ${{ !cancelled() && steps.grant.outcome == 'success' }}
      shell: pwsh
      run: |
        $plan = Get-Content -Raw build/ci-plan.json | ConvertFrom-Json
        & scripts/invoke_unelevated.ps1 -FilePath ctest -- --test-dir build -C Release `
          -j $env:NUMBER_OF_PROCESSORS --output-on-failure --no-tests=error `
          -L $env:T2_LABELS -R $plan.tests_regex
        $ctestExit = $LASTEXITCODE
        "CTEST EXIT: $ctestExit"
        exit $ctestExit

    # test_elevated_helper_connection starts the real helper through runas. Under the standard-user
    # token above that needs a consent prompt nobody on a runner can answer, so ctest skips it
    # (tests/skip_baseline.txt) and this step, which keeps the runner's elevated token, runs it. A
    # skip exits 0 too, so the step also reads the test's own PASS line. One shard holds the test.
    - name: Real helper over a real pipe
      if: ${{ !cancelled() && steps.grant.outcome == 'success' }}
      shell: pwsh
      run: |
        $plan = Get-Content -Raw build/ci-plan.json | ConvertFrom-Json
        if (@($plan.tests) -notcontains 'test_elevated_helper_connection') {
          'test_elevated_helper_connection is not in this shard'
          exit 0
        }
        $log = Join-Path $env:RUNNER_TEMP 'test_elevated_helper_connection.txt'
        $test = Start-Process -FilePath build/Release/test_elevated_helper_connection.exe -ArgumentList '-o', "$log,txt" -NoNewWindow -Wait -PassThru
        Get-Content -LiteralPath $log
        if ($test.ExitCode -ne 0) { exit $test.ExitCode }
        if (-not (Select-String -LiteralPath $log -Quiet -Pattern '^PASS\s+: ElevatedHelperConnectionTests::realHelperRunsATaskOverARealPipe\(\)')) {
          throw 'test_elevated_helper_connection did not run: a skip exits 0 too'
        }
        # Proof for the T2 result job, which requires it from the one shard whose plan holds the test.
        New-Item -ItemType Directory -Force -Path build/elevated-proof | Out-Null
        Select-String -LiteralPath $log -Pattern '^PASS\s+:' | ForEach-Object { $_.Line } |
          Set-Content -LiteralPath build/elevated-proof/test_elevated_helper_connection.txt -Encoding ascii

    # test_fat_volumes makes and mounts small FAT32 and exFAT VHDX volumes, which needs
    # administrator: under the standard-user token above ctest skips it (tests/skip_baseline.txt),
    # and this step, which keeps the runner's elevated token, runs it. A skip exits 0 too, so the
    # step reads every case's PASS line on both volumes. The test carries the product label, so the
    # shard plan places it in exactly one shard; in every other shard this step has nothing to run.
    - name: FAT32 and exFAT volumes (elevated)
      if: ${{ !cancelled() && steps.grant.outcome == 'success' }}
      shell: pwsh
      run: |
        $plan = Get-Content -Raw build/ci-plan.json | ConvertFrom-Json
        if (@($plan.tests) -notcontains 'test_fat_volumes') {
          'test_fat_volumes is not in this shard'
          exit 0
        }
        $log = Join-Path $env:RUNNER_TEMP 'test_fat_volumes.txt'
        $test = Start-Process -FilePath build/Release/test_fat_volumes.exe -ArgumentList '-o', "$log,txt" -NoNewWindow -Wait -PassThru
        Get-Content -LiteralPath $log
        if ($test.ExitCode -ne 0) { exit $test.ExitCode }
        foreach ($case in 'heldFoldersAndStagedFiles', 'heldReadOnlyFileRefusesWriters', 'programFolderOnTheVolume', 'scriptSafeFilesWithTempOnTheVolume') {
          foreach ($row in 'FAT32', 'exFAT') {
            if (-not (Select-String -LiteralPath $log -Quiet -Pattern "^PASS\s+: FatVolumeTests::$case\($row\)")) {
              throw "test_fat_volumes did not pass $case($row): a skip exits 0 too"
            }
          }
        }
        # Proof for the T2 result job, which requires it from the one shard whose plan holds the test.
        New-Item -ItemType Directory -Force -Path build/elevated-proof | Out-Null
        Select-String -LiteralPath $log -Pattern '^PASS\s+:' | ForEach-Object { $_.Line } |
          Set-Content -LiteralPath build/elevated-proof/test_fat_volumes.txt -Encoding ascii

    # test_raw_partition_write makes NTFS, FAT32 and exFAT VHDX volumes and writes them raw, as the
    # partition writers do (the take, the flush read-back, the app's own Format and Restore Image
    # scripts): administrator only, so ctest skips it under the standard-user token
    # (tests/skip_baseline.txt) and this step runs the whole suite elevated. A skip exits 0 too, so
    # the step needs a PASS line for every case and the totals to show nothing failed or skipped.
    - name: Raw partition writes (elevated)
      if: ${{ !cancelled() && steps.grant.outcome == 'success' }}
      shell: pwsh
      run: |
        $plan = Get-Content -Raw build/ci-plan.json | ConvertFrom-Json
        if (@($plan.tests) -notcontains 'test_raw_partition_write') {
          'test_raw_partition_write is not in this shard'
          exit 0
        }
        $log = Join-Path $env:RUNNER_TEMP 'test_raw_partition_write.txt'
        $test = Start-Process -FilePath build/Release/test_raw_partition_write.exe -ArgumentList '-o', "$log,txt" -NoNewWindow -Wait -PassThru
        Get-Content -LiteralPath $log
        if ($test.ExitCode -ne 0) { exit $test.ExitCode }
        $cases = @(foreach ($case in 'refusedWhileSomethingHasItOpen', 'nativeWriterReachesTheWholePartition',
                                     'scriptWriterReachesTheWholePartition', 'scriptReleaseAndClearTakeThePartition') {
                     foreach ($row in 'NTFS', 'FAT32', 'exFAT') { "$case($row)" }
                   }) + 'formatRoundTripSetsAndRestoresThePartitionType()' + 'restoreImageThroughTheGeneratedScript()' +
                   'resizeAsDataGivesAnExtPartitionItsTypeBack()' + 'hfsReadOnlyCheckStagesAndWritesNothing()' +
                   'hideOnMbrHidesOnlyThatPartition()'
        foreach ($case in $cases) {
          if (-not (Select-String -LiteralPath $log -Quiet -Pattern "^PASS\s+: RawPartitionWriteTests::$([regex]::Escape($case))\s*$")) {
            throw "test_raw_partition_write did not pass ${case}: a skip exits 0 too"
          }
        }
        if (-not (Select-String -LiteralPath $log -Quiet -Pattern '^Totals: \d+ passed, 0 failed, 0 skipped')) {
          throw 'test_raw_partition_write failed or skipped a case'
        }
        New-Item -ItemType Directory -Force -Path build/elevated-proof | Out-Null
        Select-String -LiteralPath $log -Pattern '^PASS\s+:' | ForEach-Object { $_.Line } |
          Set-Content -LiteralPath build/elevated-proof/test_raw_partition_write.txt -Encoding ascii

    # A script too long for a command line runs from standard input (sak::powerShellInvocation, the
    # same path the helper's RunPowerShell task takes); this case starts one for real and checks its
    # exit code and its Stop reach the Storage cmdlets. ctest runs it unelevated too; this step runs
    # it with the runner's elevated token, as the helper would, and needs its PASS line.
    - name: Long scripts from standard input (elevated)
      if: ${{ !cancelled() && steps.grant.outcome == 'success' }}
      shell: pwsh
      run: |
        $plan = Get-Content -Raw build/ci-plan.json | ConvertFrom-Json
        if (@($plan.tests) -notcontains 'test_process_runner') {
          'test_process_runner is not in this shard'
          exit 0
        }
        $log = Join-Path $env:RUNNER_TEMP 'test_process_runner_elevated.txt'
        $test = Start-Process -FilePath build/Release/test_process_runner.exe -ArgumentList 'runPowerShell_longScriptRunsAndKeepsItsExitCode', '-o', "$log,txt" -NoNewWindow -Wait -PassThru
        Get-Content -LiteralPath $log
        if ($test.ExitCode -ne 0) { exit $test.ExitCode }
        if (-not (Select-String -LiteralPath $log -Quiet -Pattern '^PASS\s+: ProcessRunnerTests::runPowerShell_longScriptRunsAndKeepsItsExitCode\(\)')) {
          throw 'runPowerShell_longScriptRunsAndKeepsItsExitCode did not run: a skip exits 0 too'
        }
        New-Item -ItemType Directory -Force -Path build/elevated-proof | Out-Null
        Select-String -LiteralPath $log -Pattern '^PASS\s+:' | ForEach-Object { $_.Line } |
          Set-Content -LiteralPath build/elevated-proof/test_process_runner.txt -Encoding ascii

    # The skip audit runs once over every shard's logs in the T2 result job. It needs each
    # shard's registration: a test's command resolves only where its executable was built.
    - name: Record this shard's test registration
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: pwsh
      run: |
        $plan = Get-Content -Raw build/ci-plan.json | ConvertFrom-Json
        $json = ctest --test-dir build -C Release --show-only=json-v1 -L $env:T2_LABELS -R $plan.tests_regex
        if ($LASTEXITCODE -ne 0) { throw "ctest --show-only exited $LASTEXITCODE" }
        [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'build/ci-registration.json'), ($json -join "`n"))

    - name: Upload test logs
      if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: t2-shard-${{ matrix.shard }}
        path: |
          build/ci-plan.json
          build/ci-registration.json
          build/test_results/*.txt
          build/Testing/Temporary/LastTest.log
          build/elevated-proof/*.txt
        retention-days: 14
        if-no-files-found: warn

  # ==========================================================================================
  # One required status for branch protection: every T2 job passed, all shards ran one plan,
  # and the skip audit holds the whole T2 run's QtTest logs to the reviewed baseline.
  # ==========================================================================================
  t2-result:
    name: T2 result
    needs: [static-gates, build-test]
    if: ${{ always() }}
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
    # The audit also runs when a shard's tests failed, so one run reports every problem.
    - name: Checkout code
      if: ${{ needs.build-test.result == 'success' || needs.build-test.result == 'failure' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Download shard logs
      if: ${{ needs.build-test.result == 'success' || needs.build-test.result == 'failure' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        pattern: t2-shard-*
        path: shards

    - name: Merge shard registrations
      if: ${{ needs.build-test.result == 'success' || needs.build-test.result == 'failure' }}
      shell: pwsh
      run: |
        $plans = @(Get-ChildItem shards -Recurse -Filter ci-plan.json | ForEach-Object { Get-Content -Raw $_.FullName | ConvertFrom-Json })
        if ($plans.Count -eq 0) { throw "No shard plans were uploaded" }
        $count = [int]$plans[0].shard_count
        if ($plans.Count -ne $count) { throw "Expected $count shard plans, found $($plans.Count)" }
        $digests = @($plans | ForEach-Object { $_.digest } | Sort-Object -Unique)
        if ($digests.Count -ne 1) { throw "Shards computed different build plans: $($digests -join ', ')" }
        $planned = @($plans | ForEach-Object { @($_.tests) } | Sort-Object)
        $tests = [System.Collections.Generic.List[object]]::new()
        foreach ($file in Get-ChildItem shards -Recurse -Filter ci-registration.json) {
          foreach ($t in (Get-Content -Raw $file.FullName | ConvertFrom-Json).tests) {
            $tests.Add([ordered]@{ name = $t.name; command = @($t.command) })
          }
        }
        $registered = @($tests | ForEach-Object { $_.name } | Sort-Object)
        $diff = Compare-Object -ReferenceObject $planned -DifferenceObject $registered
        if ($diff) { throw "Shard registrations differ from the plan: $($diff | Out-String)" }
        New-Item -ItemType Directory -Force -Path build/test_results | Out-Null
        Get-ChildItem shards -Recurse -File -Filter *.txt |
          Where-Object { $_.Directory.Name -eq 'test_results' } |
          Copy-Item -Destination build/test_results -Force
        $merged = [ordered]@{ kind = 'ctestInfo'; version = [ordered]@{ major = 1; minor = 0 }; tests = $tests }
        [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'build/t2-registration.json'), ($merged | ConvertTo-Json -Depth 6))
        Write-Host "Plan $($digests[0]): $count shards, $($registered.Count) T2 tests"

    # A test that can only run elevated is skipped by ctest under the standard-user token and run by
    # an elevated step in its shard, and that step passes with nothing to do in every shard whose plan
    # lacks the test. So a test moved off the T2 labels, or never planned, would pass every shard
    # unrun. Each test listed here must be in exactly one shard's plan, and that shard must have
    # uploaded its elevated step's proof: a PASS line for every case required here.
    - name: Every must-run-elevated test ran elevated
      if: ${{ needs.build-test.result == 'success' || needs.build-test.result == 'failure' }}
      shell: pwsh
      run: |
        $fatCases = foreach ($case in 'heldFoldersAndStagedFiles', 'heldReadOnlyFileRefusesWriters',
                                      'programFolderOnTheVolume', 'scriptSafeFilesWithTempOnTheVolume') {
          foreach ($row in 'FAT32', 'exFAT') { "FatVolumeTests::$case($row)" }
        }
        $rawCases = @(foreach ($case in 'refusedWhileSomethingHasItOpen', 'nativeWriterReachesTheWholePartition',
                                        'scriptWriterReachesTheWholePartition', 'scriptReleaseAndClearTakeThePartition') {
                        foreach ($row in 'NTFS', 'FAT32', 'exFAT') { "RawPartitionWriteTests::$case($row)" }
                      }) + 'RawPartitionWriteTests::formatRoundTripSetsAndRestoresThePartitionType()' +
                      'RawPartitionWriteTests::restoreImageThroughTheGeneratedScript()' +
                      'RawPartitionWriteTests::resizeAsDataGivesAnExtPartitionItsTypeBack()' +
                      'RawPartitionWriteTests::hfsReadOnlyCheckStagesAndWritesNothing()' +
                      'RawPartitionWriteTests::hideOnMbrHidesOnlyThatPartition()'
        $required = [ordered]@{
          test_elevated_helper_connection = @('ElevatedHelperConnectionTests::realHelperRunsATaskOverARealPipe()')
          test_fat_volumes = @($fatCases)
          test_raw_partition_write = @($rawCases)
          test_process_runner = @('ProcessRunnerTests::runPowerShell_longScriptRunsAndKeepsItsExitCode()')
        }
        $shards = @(Get-ChildItem -LiteralPath shards -Directory)
        $problems = [System.Collections.Generic.List[string]]::new()
        foreach ($test in $required.Keys) {
          $holders = @($shards | Where-Object {
            $planPath = Join-Path $_.FullName 'ci-plan.json'
            (Test-Path -LiteralPath $planPath -PathType Leaf) -and
              (@((Get-Content -Raw -LiteralPath $planPath | ConvertFrom-Json).tests) -contains $test)
          })
          if ($holders.Count -ne 1) {
            $problems.Add("$test is in $($holders.Count) shard plans; it must be in exactly one")
            continue
          }
          $shard = $holders[0].Name
          $proof = Join-Path $holders[0].FullName "elevated-proof/$test.txt"
          if (-not (Test-Path -LiteralPath $proof -PathType Leaf)) {
            $problems.Add("${test}: $shard uploaded no proof that its elevated step passed")
            continue
          }
          $lines = @(Get-Content -LiteralPath $proof)
          $missing = @($required[$test] | Where-Object {
            $pattern = '^PASS\s+: ' + [regex]::Escape($_) + '\s*$'
            -not ($lines | Where-Object { $_ -match $pattern })
          })
          foreach ($case in $missing) { $problems.Add("${test}: no PASS for $case in $shard") }
          if ($missing.Count -eq 0) {
            Write-Host "OK  $test ran elevated in $shard; $($required[$test].Count) case(s) passed"
          }
        }
        if ($problems.Count -gt 0) {
          $problems | ForEach-Object { Write-Host "::error::$_" }
          throw "$($problems.Count) must-run-elevated problem(s)"
        }

    # ctest scores a binary Passed even when every function called QSKIP. This holds every skip
    # in the whole T2 run to tests/skip_baseline.txt and fails on an unreviewed skip, a stale
    # baseline entry, or a registered QtTest with no log.
    - name: Test-skip audit (whole T2 run)
      if: ${{ needs.build-test.result == 'success' || needs.build-test.result == 'failure' }}
      shell: pwsh
      run: '& scripts/check_test_skips.ps1 -RegistrationJsonPath build/t2-registration.json'

    - name: Every T2 job passed
      if: ${{ always() }}
      shell: pwsh
      env:
        STATIC_GATES_RESULT: ${{ needs.static-gates.result }}
        BUILD_TEST_RESULT: ${{ needs.build-test.result }}
      run: |
        Write-Host "static-gates: $env:STATIC_GATES_RESULT"
        Write-Host "build-test:   $env:BUILD_TEST_RESULT"
        if ($env:STATIC_GATES_RESULT -ne 'success' -or $env:BUILD_TEST_RESULT -ne 'success') {
          exit 1
        }
