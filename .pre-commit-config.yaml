# =============================================================================
# S.A.K. Utility - Pre-commit Hook Configuration
# Strictest settings: every check must pass, zero tolerance for violations.
#
# Install:  pre-commit install --install-hooks
# Run all:  pre-commit run --all-files
# Update:   pre-commit autoupdate
# =============================================================================

default_language_version:
  python: python3

# Fail fast: stop on first hook failure (strictest)
fail_fast: true

repos:
  # =========================================================================
  # Standard pre-commit hooks (fast, universal checks)
  # =========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        # The portable release vendors sizable helper tools (Chocolatey, aria2, the
        # UUP media tools) so GitHub builds do not depend on external machines. Keep
        # this cap generous for those intentional release assets rather than bypassing
        # hooks. (Only newly ADDED files are checked; existing bundles are grandfathered.)
        args: [--maxkb=51200]
      - id: check-merge-conflict
      - id: check-case-conflict

  # =========================================================================
  # Local hooks - security and C++ static analysis (strictest settings)
  # =========================================================================
  - repo: local
    hooks:
      # -------------------------------------------------------------------
      # 0. Toolchain preflight - a gate that cannot run is not a gate.
      #    Runs first so a missing tool fails immediately and explicitly
      #    instead of being discovered by accident later.
      # -------------------------------------------------------------------
      - id: tool-preflight
        name: "Quality-gate toolchain preflight"
        description: "Assert every required gate tool is installed; record versions"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_tool_preflight.ps1
        language: system
        pass_filenames: false
        always_run: true

      # -------------------------------------------------------------------
      # 0b. Test registration - an assertion is only evidence once it runs.
      #     Nine test files (about 89 assertions) existed, were documented in
      #     tests/README.md, and had no CMake target, so they had never
      #     compiled or executed - while earlier remediation campaigns cited
      #     assertions inside them as proof that findings were fixed. This
      #     gate makes that state unreachable, in both directions: a source
      #     that nothing builds, and a target that ctest never runs.
      # -------------------------------------------------------------------
      - id: test-registration
        name: "Test registration structure (target + ctest entry per test)"
        description: "Static CMakeLists cross-check: every test source has an add_executable and
          every target an add_test. This does NOT compile or run anything -- the authoritative
          build+ctest gate is CI (a full build failure fails the job). Do not read a green here
          as proof the tree builds."
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_test_registration.ps1
        language: system
        pass_filenames: false
        always_run: true

      # -------------------------------------------------------------------
      # 1. Secret/path scan - no key-shaped literals or developer paths
      # -------------------------------------------------------------------
      - id: secret-path-scan
        name: "Secret/path scan"
        description: "Reject key-shaped literals and hardcoded developer-machine paths"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/scan_secrets.ps1 -SkipExternalTools
        language: system
        pass_filenames: false

      # -------------------------------------------------------------------
      # 2. Qt resource manifest check - every qrc file path must exist
      # -------------------------------------------------------------------
      - id: qrc-resource-check
        name: "Qt resource manifest check"
        description: "Reject .qrc manifests that reference missing files"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_qrc_resources.ps1
        language: system
        pass_filenames: false

      # -------------------------------------------------------------------
      # 3. PowerShell syntax - parse scripts without executing them
      # -------------------------------------------------------------------
      - id: powershell-syntax
        name: "PowerShell syntax check"
        description: "Reject malformed .ps1 files"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_powershell_syntax.ps1
        language: system
        files: \.ps1$

      # -------------------------------------------------------------------
      # 4. clang-format - zero formatting deviations allowed
      # -------------------------------------------------------------------
      - id: clang-format
        name: "clang-format (strict)"
        description: "Enforce .clang-format style on all C++ files"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/run_clang_format.ps1 -Check -Files
        language: system
        types_or: [c, c++]
        files: \.(cpp|h|hpp|cxx|cc|hxx)$
        exclude: (third_party|3rdparty|external|_archived)/

      # -------------------------------------------------------------------
      # 5. Lizard - cyclomatic complexity and function metrics
      #    CCN <= 10, length <= 70, params <= 5
      # -------------------------------------------------------------------
      - id: lizard-complexity
        name: "Lizard complexity (strict)"
        description: "CCN <=10, function length <=70, parameters <=5"
        entry: python scripts/run_lizard.py
        language: system
        types_or: [c, c++]
        files: \.(cpp|h|hpp|cxx|cc|hxx)$
        exclude: (third_party|3rdparty|external|_archived)/

      # -------------------------------------------------------------------
      # 6. cppcheck - deep static analysis
      #    All checks, exhaustive level, inconclusive, C++23
      # -------------------------------------------------------------------
      - id: cppcheck
        name: "cppcheck (exhaustive)"
        description: "Static analysis: all checks enabled, exhaustive depth, C++23"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/run_cppcheck.ps1 -Files
        language: system
        types_or: [c, c++]
        files: \.(cpp|h|hpp|cxx|cc|hxx)$
        exclude: (third_party|3rdparty|external|_archived)/

      # -------------------------------------------------------------------
      # 6a. clang-tidy naming regression gate (MANUAL stage)
      #     readability-identifier-naming reached zero in every first-party
      #     directory except src/core (a documented carve-out; see
      #     src/core/.clang-tidy). A full run is ~5 minutes over 147 TUs and
      #     needs a reconstructed compile database, too slow for every commit,
      #     so it is manual-stage -- CI runs it automatically on every build.
      #     Check locally with:
      #       pre-commit run --hook-stage manual clang-tidy-naming --all-files
      # -------------------------------------------------------------------
      - id: clang-tidy-naming
        name: "clang-tidy naming regression gate (non-core)"
        description: "readability-identifier-naming must stay at zero outside src/core"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/clang_tidy_naming_gate.ps1
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      # -------------------------------------------------------------------
      # 6b. Nested event loops and unbounded blocking waits
      #     Debt reached zero, so this one is now wired. Every gated site
      #     carries a SAK-ALLOW-BLOCKING justification; see the script header.
      # -------------------------------------------------------------------
      - id: blocking-patterns
        name: "Nested event loop / unbounded wait check"
        description: "Event loops and no-timeout joins must be justified at the site"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_blocking_patterns.ps1
        language: system
        pass_filenames: false

      # -------------------------------------------------------------------
      # 6c. GUI style tokens - raw color literals must live in theme constants
      #     Debt reached zero (the one residual was a QColor::rgba() method
      #     call read into a pixmap cache key, not a raw token; the matcher now
      #     excludes method/static calls), so this one is wired.
      # -------------------------------------------------------------------
      - id: gui-style-tokens
        name: "GUI style token check"
        description: "Raw color literals must live in the theme/style constant headers"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_gui_style_tokens.ps1
        language: system
        pass_filenames: false

      # -------------------------------------------------------------------
      # 6d. GUI magic numbers - layout/sizing calls must use named metrics
      #     Debt reached zero (the residual 18 raw literals were folded into
      #     the sak::ui margin/spacing tokens and per-file Files-xaml metric
      #     constants), so this one is wired.
      # -------------------------------------------------------------------
      - id: gui-magic-numbers
        name: "GUI magic-number check"
        description: "Layout/sizing calls must reference named metric constants"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_gui_magic_numbers.ps1
        language: system
        pass_filenames: false

      # -------------------------------------------------------------------
      # 6e. GUI stylesheet literals - raw QSS/CSS must live in a style header
      #     Debt reached zero (the 70 explorer QSS templates moved into
      #     include/sak/file_explorer_style_constants.h and the rich-text
      #     wrapper into rich_text_constants.h; two prose false positives were
      #     removed by requiring a real semicolon-terminated declaration), so
      #     this one is wired.
      # -------------------------------------------------------------------
      - id: gui-stylesheet-literals
        name: "GUI stylesheet literal check"
        description: "Raw QSS/CSS style literals must live in a style-constants header"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_gui_stylesheet_literals.ps1
        language: system
        pass_filenames: false

      # -------------------------------------------------------------------
      # 6f. Magic numbers - bare numeric literals must be named constexpr
      #     Debt reached zero: every literal outside the -1/0/1 sentinels was
      #     named across the tree (the on-disk-format and crypto modules stay
      #     exempt in the script, where hand-naming byte offsets is high-risk
      #     churn against certified output), so this one is wired.
      # -------------------------------------------------------------------
      - id: magic-numbers
        name: "Magic-number check"
        description: "Bare numeric literals must be named constexpr constants"
        entry: python scripts/check_magic_numbers.py
        language: system
        pass_filenames: false

      # -------------------------------------------------------------------
      # All GUI/style/magic-number debt gates are now wired above. Any new
      # gate script added later that reports debt should follow the same
      # pattern: fix the debt to zero, then list the hook here.
      # -------------------------------------------------------------------

      # -------------------------------------------------------------------
      # 7. Logged message boxes - user-facing dialogs must also be logged
      # -------------------------------------------------------------------
      - id: logged-message-boxes
        name: "Logged message box check"
        description: "Every user-facing message box must also write a log record"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_logged_message_boxes.ps1
        language: system
        pass_filenames: false

      # -------------------------------------------------------------------
      # 8. Partition filesystem tool manifest integrity
      # -------------------------------------------------------------------
      - id: partition-fs-tool-manifest
        name: "Partition filesystem tool manifest check"
        description: "Reject a filesystem tool manifest that does not match the code"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_partition_filesystem_tool_manifest.ps1
        language: system
        pass_filenames: false

      # Build-system lint (G23-9): a real if(CMAKE_BUILD_TYPE STREQUAL ...) guard is
      # DEAD under the Visual Studio multi-config generator (one such guard had
      # silently disabled AddressSanitizer project-wide). Fail if one reappears.
      - id: build-system-lint
        name: "Build-system lint (no dead CMAKE_BUILD_TYPE guards)"
        description: "Reject a dead config-guard that is inert under the multi-config generator"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_build_system_lint.ps1
        language: system
        pass_filenames: false

      # G23-12: no "unknown error" literals; no NEW duplicate error message across two
      # distinct sink sites (legacy duplicates grandfathered in a committed baseline).
      - id: error-message-uniqueness
        name: "Error-message uniqueness"
        description: "No 'unknown error' literals; no NEW duplicate error messages (baseline-gated)"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_error_message_uniqueness.ps1
        language: system
        pass_filenames: false

      # G23-8: any factual claim in tests/README.md (test counts / names / coverage) must
      # match the real ctest registration and test_*.cpp files -- this is how nine dead
      # test files once stayed hidden behind a README that asserted coverage that did not exist.
      - id: doc-accuracy
        name: "Doc-accuracy gate (tests/README.md vs real ctest list)"
        description: "Machine-verify the test-count/coverage claims in tests/README.md against reality"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_doc_accuracy.ps1
        language: system
        pass_filenames: false

      # -------------------------------------------------------------------
      # 8b. Partition Manager certification / release-claim integrity gates.
      #     These verify that the documented certification matrices, release
      #     claims, feature/commercial matrices and external checklist stay
      #     consistent with the code and with each other. Fast static checks
      #     (docs + source grep + a stored certification report); wired now
      #     that all pass. Build-requiring gates (accessibility runtime audit,
      #     verify_build) run in CI, not here.
      # -------------------------------------------------------------------
      - id: partition-release-claims
        name: "Partition Manager release-claims consistency"
        description: "Release-facing docs must match the declared certification level"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_partition_manager_release_claims.ps1
        language: system
        pass_filenames: false

      - id: partition-feature-matrix
        name: "Partition Manager feature matrix"
        description: "Every feature group maps to real code + certification IDs"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_partition_manager_feature_matrix.ps1
        language: system
        pass_filenames: false

      - id: partition-cert-matrix-integrity
        name: "Partition Manager certification matrix integrity"
        description: "VHD scenarios and external gates in the matrix are internally consistent"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_partition_manager_certification_matrix_integrity.ps1
        language: system
        pass_filenames: false

      - id: partition-commercial-gate-matrix
        name: "Partition Manager commercial gate matrix"
        description: "Each commercial gate has its required code/UI/test/cert evidence"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_partition_manager_commercial_gate_matrix.ps1
        language: system
        pass_filenames: false

      - id: partition-cert-gap-report
        name: "Partition Manager certification gap report"
        description: "Incomplete certification gates are enumerated and consistent"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_partition_manager_certification_gap_report.ps1
        language: system
        pass_filenames: false

      - id: partition-external-checklist
        name: "Partition Manager external checklist"
        description: "External VM/hardware/lab gates match the certification matrix"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_partition_manager_external_checklist.ps1
        language: system
        pass_filenames: false

      - id: partition-cert-verification
        name: "Partition Manager certification verification"
        description: "The stored strict-VHD certification report matches the matrix"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/verify_partition_manager_certification.ps1
        language: system
        pass_filenames: false

      # -------------------------------------------------------------------
      # 9. Third-party licenses (previously CI-only)
      # -------------------------------------------------------------------
      - id: third-party-licenses
        name: "Third-party license check"
        description: "Every bundled third-party component must carry its license"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_third_party_licenses.ps1
        language: system
        pass_filenames: false

      # -------------------------------------------------------------------
      # 10. ASCII-only text - no byte above 0x7F, no UTF-8 BOM. Sources and
      #     docs are plain 7-bit ASCII; non-ASCII here has repeatedly been
      #     silent damage (a double-encoded em dash that sat in a comment for
      #     months, mojibake test data) rather than typography. See the
      #     scripts/check_ascii_only.ps1 header for the rule and the \u-escape
      #     escape hatch for a codepoint that must reach a user. Wired now that
      #     the whole tree is clean (1467 files pass); the script self-excludes
      #     binary extensions and vendored/evidence trees, and pre-commit passes
      #     only the changed files.
      # -------------------------------------------------------------------
      - id: ascii-only
        name: "ASCII-only text (no byte > 0x7F, no BOM)"
        description: "Reject non-ASCII bytes or a UTF-8 BOM in tracked text files"
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/check_ascii_only.ps1
        language: system
        exclude: (tools/chocolatey|tools/uup|tools/iperf3|tools/smartmontools|artifacts)/
